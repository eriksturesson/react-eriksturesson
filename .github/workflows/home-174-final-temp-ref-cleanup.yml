name: HOME-174 final temporary-ref cleanup

on:
  push:
    branches: [master]
    paths: [.github/workflows/home-174-final-temp-ref-cleanup.yml]

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete exact temporary refs and self-remove
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowPath = '.github/workflows/home-174-final-temp-ref-cleanup.yml';
            if (owner !== 'eriksturesson' || repo !== 'react-eriksturesson' || context.ref !== 'refs/heads/master') throw new Error(`Unexpected execution context ${owner}/${repo} ${context.ref}`);
            const candidates = [
              ['home-174-cleanup-remotes', 'bbc851e9e6408fd1edfdbd1bcb87cad93ae27681'],
              ['home-174-remove-cleanup-workflow', 'b961b2494970b6ffc191cb2328a8849e11a44aef'],
            ];
            for (const [branch, expectedSha] of candidates) {
              const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              if (ref.data.object.sha !== expectedSha) throw new Error(`${branch}: tip moved; refusing cleanup`);
              const pulls = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${branch}`, per_page: 100 });
              if (pulls.data.length) throw new Error(`${branch}: has open PR(s); refusing cleanup`);
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
              core.info(`${branch}: deleted`);
            }
            const file = await github.rest.repos.getContent({ owner, repo, path: workflowPath, ref: 'master' });
            if (Array.isArray(file.data) || !file.data.sha) throw new Error('Cannot resolve cleanup workflow file SHA');
            await github.rest.repos.deleteFile({ owner, repo, path: workflowPath, message: 'HOME-174: self-remove final temporary-ref cleanup', sha: file.data.sha, branch: 'master' });
            core.info('Temporary cleanup workflow removed from master');
