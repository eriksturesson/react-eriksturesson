name: Staging — Firebase preview

# Ger staging-grenen mening. Fram till 2026-09-02 fanns origin/staging men
# pekade på exakt samma commit som master och ingen workflow triggade på
# den — grenen gjorde alltså ingenting alls (HOME-84).
#
# Firebase preview channel och inte en riktig staging-hostname: det ger en
# gratis *.web.app-URL utan ny tunnel, DNS-post eller Worker.

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Samma kontroll som gäller mot master. En staging som deployar trasig
  # kod är inte en testmiljö, den är en andra plats felet syns på.
  check:
    uses: ./.github/workflows/check.yml

  deploy-staging:
    needs: check
    # workflow_dispatch may select another ref; preview deploys are intentionally
    # sourced only from the canonical staging integration branch.
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: dockerProduction
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Refuse unexpected project configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          if [ "$GCP_PROJECT_ID" != "reacteriksturessonse" ]; then
            echo "Expected GCP_PROJECT_ID=reacteriksturessonse, got '$GCP_PROJECT_ID'" >&2
            exit 1
          fi

      - name: Deploy to stable Firebase preview channel
        run: npx --yes firebase-tools@15.30.0 hosting:channel:deploy staging --project reacteriksturessonse --expires 30d --non-interactive
