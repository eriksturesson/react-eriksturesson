name: HOME-174 guarded branch cleanup

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/home-174-branch-cleanup.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete exact superseded branch tips only
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            if (owner !== 'eriksturesson' || repo !== 'react-eriksturesson' || context.ref !== 'refs/heads/master') {
              core.setFailed(`Unexpected execution context ${owner}/${repo} ${context.ref}`);
              return;
            }
            const candidates = [
              ['serverOnDocker', '4aa56cba466302c752a4b60871fb7d7649c09b9a'],
              ['home-75-ghcr-only-immutable', '3ab2e2075c7821f6e0c79d8290cc004105467935'],
            ];
            for (const [branch, expectedSha] of candidates) {
              const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              if (ref.data.object.sha !== expectedSha) {
                core.setFailed(`${branch}: tip moved; refusing cleanup`);
                return;
              }
              const pulls = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${branch}`, per_page: 100 });
              if (pulls.data.length !== 0) {
                core.setFailed(`${branch}: has open PR(s); refusing cleanup`);
                return;
              }
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
              core.info(`${branch}: deleted exact tip ${expectedSha}`);
            }
