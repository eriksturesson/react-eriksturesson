name: Deploy to Firebase Hosting

# Publikt repo — se docker-publish.yml, minuterna är fria här.

on:
  push:
    branches:
      - master
    # Hostingen serverar bara frontend-bundlen; server.ts och Dockerfile
    # påverkar containern, inte det som ligger på Firebase.
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "firebase.json"
      - "database.rules.json"
      - "storage.rules"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deploy-spärren. `needs:` fungerar bara inom en och samma workflow, och
  # master är oskyddad -- det här är alltså det som faktiskt hindrar en
  # trasig master från att nå produktion (HOME-84).
  check:
    uses: ./.github/workflows/check.yml

  firebase-deploy:
    needs: check
    # A manual workflow_dispatch can be started from another branch. Never let
    # the live workflow consume staging/feature code even if that ref can obtain
    # a WIF credential for its own preview workflow.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: dockerProduction
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # INGEN `cache: "npm"` här, och inget `npm ci` nedan. Båda kräver en
          # lockfil i repot, och package-lock.json är gitignorerad här — den
          # finns bara lokalt. setup-node failar då direkt med "Dependencies
          # lock file is not found", vilket är precis vad som hände 2026-08-17.
          #
          # Vill man ha determinism och cache är fixen att börja spåra
          # lockfilen (ta bort raden ur .gitignore och committa den), inte att
          # lägga tillbaka de här två raderna.

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      # HOME-270: GitHub exchanges its OIDC token for a short-lived Google
      # credential. No service-account key JSON is written to GitHub Secrets.
      # Authenticate after the build so the short-lived credential is used only
      # for the actual cloud operation.
      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Refuse unexpected project configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          if [ "$GCP_PROJECT_ID" != "reacteriksturessonse" ]; then
            echo "Expected GCP_PROJECT_ID=reacteriksturessonse, got '$GCP_PROJECT_ID'" >&2
            exit 1
          fi

      # Firebase CLI supports ADC/WIF. Pin the CLI so a future auth regression
      # cannot silently change the production deploy path between runs.
      - name: Deploy to Firebase Hosting live channel
        run: npx --yes firebase-tools@15.30.0 deploy --only hosting --project reacteriksturessonse --non-interactive
