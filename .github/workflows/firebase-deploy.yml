name: Deploy to Firebase Hosting

# Publikt repo — se docker-publish.yml, minuterna är fria här.

on:
  push:
    branches:
      - master
    # Hostingen serverar bara frontend-bundlen; server.ts och Dockerfile
    # påverkar containern, inte det som ligger på Firebase.
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "firebase.json"
      - "database.rules.json"
      - "storage.rules"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firebase-deploy:
    runs-on: ubuntu-latest
    environment: dockerProduction

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # npm ci, inte npm install: lockfilen ska följas exakt i CI.
      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Build and Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: live
          projectId: reacteriksturessonse
