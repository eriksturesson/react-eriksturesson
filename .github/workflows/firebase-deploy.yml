name: Deploy to Firebase Hosting

# Publikt repo — se docker-publish.yml, minuterna är fria här.

on:
  push:
    branches:
      - master
    # Hostingen serverar bara frontend-bundlen; server.ts och Dockerfile
    # påverkar containern, inte det som ligger på Firebase.
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "firebase.json"
      - "database.rules.json"
      - "storage.rules"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deploy-spärren. `needs:` fungerar bara inom en och samma workflow, och
  # master är oskyddad -- det här är alltså det som faktiskt hindrar en
  # trasig master från att nå produktion (HOME-84).
  check:
    uses: ./.github/workflows/check.yml

  firebase-deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: dockerProduction

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # INGEN `cache: "npm"` här, och inget `npm ci` nedan. Båda kräver en
          # lockfil i repot, och package-lock.json är gitignorerad här — den
          # finns bara lokalt. setup-node failar då direkt med "Dependencies
          # lock file is not found", vilket är precis vad som hände 2026-08-17.
          #
          # Vill man ha determinism och cache är fixen att börja spåra
          # lockfilen (ta bort raden ur .gitignore och committa den), inte att
          # lägga tillbaka de här två raderna.

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Build and Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: live
          projectId: reacteriksturessonse
