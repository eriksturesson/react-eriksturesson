worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Approx of express-rate-limit: document navigations, not static assets.
  limit_req_zone $binary_remote_addr zone=nav:10m rate=20r/m;

  # CSP must stay in sync with former helmet directives in server.ts (HOME-331).
  # Inline script hashes cover Consent Mode default + GTM bootstrap in index.html.
  map $sent_http_content_type $csp {
    default "";
    ~*text/html "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com https://img.shields.io https://shields.io https://www.googletagmanager.com https://*.cookiebot.com https://*.cookiebot.eu 'sha256-dSnkGkMGlYXxDN8GEc0fSJVZzgkTLU91LHpMw3z4w+M=' 'sha256-gnVyfFP8juV6nBVgFjcPSSIdKjCg+hJZzFFyf/YqHyU='; style-src 'self' 'unsafe-inline' https://img.shields.io https://*.cookiebot.com https://*.cookiebot.eu; img-src 'self' https://img.shields.io data: https://*.cookiebot.com https://*.cookiebot.eu https://www.googletagmanager.com; connect-src 'self' https://www.googletagmanager.com https://static.cloudflareinsights.com https://*.cookiebot.com https://*.cookiebot.eu https://*.google-analytics.com https://*.analytics.google.com; frame-src 'self' https://*.cookiebot.com https://*.cookiebot.eu";
  }

  server {
    listen 0.0.0.0:3009;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Worker failover + Uptime Kuma poll this on every check (must stay 200).
    location = /health {
      access_log off;
      default_type application/json;
      return 200 '{"ok":true}';
    }

    location ~* \.(js|css|map|png|jpe?g|gif|svg|ico|webp|avif|pdf|woff2?|ttf|eot|json|xml|txt)$ {
      expires 7d;
      add_header Cache-Control "public";
      try_files $uri =404;
    }

    location / {
      limit_req zone=nav burst=40 nodelay;
      add_header Content-Security-Policy $csp always;
      try_files $uri $uri/index.html /index.html;
    }
  }
}
